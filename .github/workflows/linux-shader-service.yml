name: Linux NativeAOT shader service protocol

on:
  pull_request:
    paths:
      - 'linux_port/build_shader_service.sh'
      - 'linux_port/test_shader_service_protocol.py'
      - 'games/totk/tools/totk_xlate/**'
      - 'vendor/ryujinx/src/**'
      - '.github/workflows/linux-shader-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translator-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libicu-dev libssl-dev libunwind-dev
      - name: Build translator and check recovery protocol with synthetic inputs
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: make -C linux_port shader-service-linux
